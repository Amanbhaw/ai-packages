[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-prompt-firewall"
version = "0.1.0"
description = "Local, zero-dependency guardrail for LLM apps: blocks PII (Luhn cards, Verhoeff Aadhaar), API-key/secret leaks, and prompt injection before text leaves your process."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["llm", "prompt-injection", "pii", "redaction", "security", "guardrail", "ai", "firewall"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Amanbhaw/prompt-firewall"

[tool.setuptools.packages.find]
where = ["src"]
