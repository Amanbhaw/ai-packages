[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-zk-auth"
version = "0.1.0"
description = "Tiny zero-dependency auth + commitment toolkit: Mersenne-31 cross-platform fingerprint, HMAC-SHA256 device challenge-response, and Merkle membership proofs."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["mersenne31", "merkle", "commitment", "hmac", "iot", "device-auth", "fingerprint", "embedded"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/Amanbhaw/tiny-zk-auth"

[tool.setuptools.packages.find]
where = ["src"]
