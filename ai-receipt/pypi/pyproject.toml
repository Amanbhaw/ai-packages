[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-receipt"
version = "0.1.0"
description = "Zero-dependency cryptographic audit receipts for AI agents & LLM calls (tamper-evident hash chain, selective disclosure, O(1) fold). Cross-verifiable with the npm package."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["ai", "llm", "audit", "receipt", "tamper-proof", "compliance", "soc2", "hash-chain", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/Amanbhaw/ai-receipt"

[tool.setuptools.packages.find]
where = ["src"]
